<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPM Tap Meter</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; text-align: center; margin: 0; padding: 1.5rem; }
  h1 { font-size: 1.3rem; }
  #bpm { font-size: 4.5rem; font-weight: bold; margin: .5rem 0; }
  #tap { font-size: 2rem; padding: 2rem 4rem; border-radius: 1rem; border: 0; background: #2d7ff9; color: #fff; cursor: pointer; touch-action: manipulation; }
  #tap:active, #tap.pressed { background: #1b5cc0; }
  .stats { display: flex; justify-content: center; gap: 2rem; margin: 1.5rem 0; }
  .stats div span { display: block; font-size: 1.8rem; }
  .stats small { color: #999; }
  #gauge { width: min(400px, 90%); height: 20px; margin: .5rem auto; background: #333; border-radius: 10px; overflow: hidden; }
  #gaugeFill { height: 100%; width: 0; background: #888; transition: width .2s, background .2s; }
  #reset { margin-top: 1rem; padding: .5rem 1.5rem; }
  footer { margin-top: 2rem; color: #999; font-size: .8rem; }
</style>
</head>
<body>
<h1>BPM Tap Meter</h1>
<div id="bpm">--</div>
<button id="tap">Tap (or press space)</button>
<div class="stats">
  <div><small>Low</small><span id="min">--</span></div>
  <div><small>Avg</small><span id="avg">--</span></div>
  <div><small>High</small><span id="max">--</span></div>
</div>
<div><small>Confidence</small></div>
<div id="gauge" role="meter" aria-label="Confidence" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="gaugeFill"></div></div>
<div id="stab">--</div>
<button id="reset">Reset</button>
<footer>v2.18</footer>
<script>
(function () {
  var taps = [];
  var WARMUP = 2;          // ignore first taps
  var WINDOW = 24;         // use most recent taps
  var LOCK_ERR = 0.5;      // BPM uncertainty considered "accurate"
  var LOCK_STREAK = 4;     // consecutive taps under threshold
  var streak = 0, locked = false;
  var $ = function (id) { return document.getElementById(id); };

  // Least-squares fit of time = a + period * index. Returns bpm and its standard error (in BPM).
  function compute(times) {
    var t = times.slice(WARMUP).slice(-WINDOW);
    var n = t.length;
    if (n < 4) return null;
    var im = (n - 1) / 2, tm = 0, i;
    for (i = 0; i < n; i++) tm += t[i];
    tm /= n;
    var sxx = 0, sxy = 0;
    for (i = 0; i < n; i++) { sxx += (i - im) * (i - im); sxy += (i - im) * (t[i] - tm); }
    var period = sxy / sxx, a = tm - period * im, rss = 0;
    for (i = 0; i < n; i++) { var r = t[i] - (a + period * i); rss += r * r; }
    var se = Math.sqrt(rss / (n - 2)) / Math.sqrt(sxx);
    var bpm = 60000 / period;
    return { bpm: bpm, err: bpm * se / period, n: n };
  }

  function fmt(v) { return v == null ? '--' : String(Math.round(v)); }
  function fmtDecimal(v) { return v == null ? '--' : v.toFixed(2); }

  function render() {
    var s = compute(taps);
    var pct = 0, msg = taps.length ? 'Keep tapping…' : 'Tap along with the beat';
    if (s) {
      // 0 err -> 100%, 3 BPM err -> 0%
      pct = Math.max(0, Math.min(100, 100 * (1 - s.err / 3)));
      streak = s.err <= LOCK_ERR ? streak + 1 : 0;
      if (streak >= LOCK_STREAK) locked = true;
      if (s.err > LOCK_ERR * 3) locked = false;   // lost the beat
      msg = locked ? '✓ Locked – you can stop tapping'
                   : (s.err > 1.5 ? 'Still settling…' : 'Almost there…');
    }
    $('bpm').textContent = s ? fmt(s.bpm) : '--';
    $('avg').textContent = s ? fmtDecimal(s.bpm) : '--';
    $('min').textContent = s ? fmtDecimal(s.bpm - s.err) : '--';
    $('max').textContent = s ? fmtDecimal(s.bpm + s.err) : '--';
    var fill = $('gaugeFill');
    fill.style.width = pct + '%';
    fill.style.background = locked ? 'hsl(130,70%,45%)' : 'hsl(' + (pct * 0.9) + ',70%,45%)';
    $('gauge').setAttribute('aria-valuenow', Math.round(pct));
    $('stab').textContent = s ? msg + '  (±' + s.err.toFixed(2) + ' BPM)' : msg;
    $('bpm').style.color = locked ? '#5f5' : '';
  }

  function reset() { taps = []; streak = 0; locked = false; render(); }

  function tap(ts) {
    ts = ts || performance.now();
    var last = taps[taps.length - 1];
    if (last != null) {
      // Long pause relative to cadence: start a fresh measurement
      var cadence = taps.length >= 3 ? (last - taps[0]) / (taps.length - 1) : 1000;
      if (ts - last > Math.max(2.5 * cadence, 2000)) reset();
    }
    taps.push(ts);
    render();
  }

  var btn = $('tap');
  btn.addEventListener('mousedown', function (e) { e.preventDefault(); btn.classList.add('pressed'); tap(e.timeStamp); });
  btn.addEventListener('mouseup', function () { btn.classList.remove('pressed'); });
  btn.addEventListener('mouseleave', function () { btn.classList.remove('pressed'); });
  btn.addEventListener('touchstart', function (e) { e.preventDefault(); btn.classList.add('pressed'); tap(e.timeStamp); }, { passive: false });
  btn.addEventListener('touchend', function () { btn.classList.remove('pressed'); });
  btn.addEventListener('touchcancel', function () { btn.classList.remove('pressed'); });
  btn.addEventListener('click', function (e) { e.preventDefault(); });
  $('reset').addEventListener('click', function (e) { e.currentTarget.blur(); reset(); });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); tap(e.timeStamp); }
  });
  render();
})();
</script>
</body>
</html>
