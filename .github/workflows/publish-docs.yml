name: Publish to docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update version and publish docs
        env:
          PUSH_COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          mkdir -p docs
          commit_count=$(jq 'if type == "array" then length else 0 end' <<< "$PUSH_COMMITS")
          minor=$(sed -nE 's#<footer>v1\.([0-9]+)</footer>#\1#p' index.html)
          version=$((minor + commit_count))
          sed -E -i "s#<footer>v1\\.[0-9]+</footer>#<footer>v1.${version}</footer>#" index.html
          cp index.html docs/index.html
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain index.html docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html docs
            git commit -m "Publish index.html to docs"
            git push
          fi
